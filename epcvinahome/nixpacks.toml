epcvinahome# EPCVINA Home - Corporate Website (Static)
# Deployed separately on Dokploy

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npm run build"]

[variables]
NODE_ENV = "production"

# Serve static files (NO --single flag for Astro static routing)
[start]
cmd = "npx serve dist -l ${PORT:-3000}"
