# EPCVINA Multi-Site Deployment
# Root package.json provides build scripts for Nixpacks detection

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cmds = ["npm install --no-package-lock"]

[phases.build]
cmds = ["npm run build"]

[variables]
HOST = "0.0.0.0"
PORT = "3000"
NODE_ENV = "production"

[start]
cmd = "npm start"
