<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Không có kết nối - EPCVINA Solar</title>
  <meta name="theme-color" content="#f97316">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f172a;color:#e2e8f0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
    .container{max-width:480px;text-align:center}
    .icon{width:120px;height:120px;margin:0 auto 2rem;opacity:.7}
    h1{font-size:1.75rem;font-weight:700;color:#f8fafc;margin-bottom:.75rem}
    p{color:#94a3b8;line-height:1.6;margin-bottom:1.5rem;font-size:1rem}
    .brand{color:#f97316;font-weight:600}
    .actions{display:flex;flex-direction:column;gap:.75rem;align-items:center}
    .btn{display:inline-flex;align-items:center;gap:.5rem;padding:.875rem 2rem;border-radius:.75rem;font-size:1rem;font-weight:600;text-decoration:none;transition:all .2s;cursor:pointer;border:none}
    .btn-primary{background:#f97316;color:#fff}
    .btn-primary:hover{background:#ea580c}
    .btn-secondary{background:rgba(255,255,255,.08);color:#e2e8f0;border:1px solid rgba(255,255,255,.12)}
    .btn-secondary:hover{background:rgba(255,255,255,.15)}
    .info{margin-top:2.5rem;padding:1.25rem;background:rgba(255,255,255,.05);border-radius:.75rem;border:1px solid rgba(255,255,255,.08)}
    .info h2{font-size:.875rem;color:#f8fafc;margin-bottom:.5rem}
    .info p{font-size:.875rem;margin-bottom:0}
    .phone{color:#f97316;font-weight:600;font-size:1.1rem}
    .status{display:inline-flex;align-items:center;gap:.5rem;padding:.375rem .75rem;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:2rem;font-size:.75rem;color:#fca5a5;margin-bottom:1.5rem}
    .status-dot{width:6px;height:6px;background:#ef4444;border-radius:50%;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  </style>
</head>
<body>
  <div class="container">
    <div class="status">
      <span class="status-dot"></span>
      Không có kết nối mạng
    </div>

    <svg class="icon" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="60" cy="60" r="56" stroke="#334155" stroke-width="2"/>
      <path d="M60 28C43.4 28 30 41.4 30 58c0 16.6 13.4 30 30 30s30-13.4 30-30C90 41.4 76.6 28 60 28z" fill="none" stroke="#475569" stroke-width="2"/>
      <path d="M44 52l32 24M76 52L44 76" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="60" cy="58" r="8" fill="#f97316" opacity=".2"/>
      <circle cx="60" cy="58" r="4" fill="#f97316"/>
    </svg>

    <h1>Oops! Mất kết nối</h1>
    <p>Không tìm thấy kết nối mạng. Vui lòng kiểm tra kết nối và thử lại.</p>

    <div class="actions">
      <button class="btn btn-primary" onclick="window.location.reload()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        Thử lại
      </button>
      <a class="btn btn-secondary" href="/">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        Về trang chủ
      </a>
    </div>

    <div class="info">
      <h2>Cần tư vấn ngay?</h2>
      <p>Gọi <a href="tel:0988446113" class="phone">0988.446.113</a><br>
      hoặc nhắn Zalo để được hỗ trợ</p>
    </div>

    <p style="margin-top:2rem;font-size:.75rem;color:#64748b">
      <span class="brand">EPCVINA Solar</span> &mdash; Điện mặt trời trọn gói
    </p>
  </div>

  <script>
    // Auto-retry when connection is restored
    window.addEventListener('online', () => {
      document.querySelector('.status').innerHTML = '<span class="status-dot" style="background:#22c55e"></span> Đang kết nối lại...';
      document.querySelector('.status').style.background = 'rgba(34,197,94,.1)';
      document.querySelector('.status').style.borderColor = 'rgba(34,197,94,.2)';
      document.querySelector('.status').style.color = '#86efac';
      setTimeout(() => window.location.reload(), 1500);
    });
  </script>
</body>
</html>
