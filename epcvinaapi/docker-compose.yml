services:
  postgres:
    image: postgres:16-alpine
    container_name: epcvina-postgres
    environment:
      POSTGRES_DB: epcvina
      POSTGRES_USER: epcvina
      POSTGRES_PASSWORD: epcvina
    ports:
      - "5432:5432"
    volumes:
      - epcvina_pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U epcvina -d epcvina"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: epcvina-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://epcvina:epcvina@postgres:5432/epcvina?sslmode=disable
      ALLOWED_ORIGIN: "*"
    ports:
      - "8080:8080"
    command: ["./epcvinaapi"]

volumes:
  epcvina_pgdata:
